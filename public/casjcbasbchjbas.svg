<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%">
  <!-- FNB Main Monogram Header -->
  <g id="FNB-Monogram">
    <!-- F shape -->
    <path d="M 30 35 C 30 18, 48 8, 85 8 L 165 8 C 178 8, 186 16, 186 25 C 186 34, 178 40, 165 40 L 75 40 L 75 58 L 150 58 C 162 58, 168 64, 168 72 C 168 80, 162 86, 150 86 L 75 86 L 75 125 C 75 133, 66 138, 52 138 C 38 138, 30 133, 30 125 Z" fill="#D32F2F" />

    <!-- Black vertical cutout accent inside N -->
    <rect x="110" y="60" width="22" height="52" rx="3" fill="#1A1A1A" />

    <!-- N shape -->
    <path d="M 100 8 L 134 8 L 192 84 L 192 18 C 192 10, 198 8, 206 8 C 214 8, 220 10, 220 18 L 220 125 C 220 133, 212 138, 198 138 L 170 138 L 100 48 Z" fill="#D32F2F" />

    <!-- B shape -->
    <path d="M 210 8 L 290 8 C 328 8, 354 24, 354 48 C 354 62, 340 73, 318 78 C 344 83, 362 96, 362 118 C 362 138, 332 138, 290 138 L 210 138 C 202 138, 196 132, 196 124 L 196 22 C 196 14, 202 8, 210 8 Z M 242 32 L 242 58 L 285 58 C 302 58, 316 50, 316 45 C 316 40, 302 32, 285 32 Z M 242 86 L 242 114 L 288 114 C 308 114, 322 106, 322 100 C 322 94, 308 86, 288 86 Z" fill="#D32F2F" fill-rule="evenodd" />
  </g>

  <!-- Middle: FURNITURE in Bold Serif -->
  <text x="230" y="166" text-anchor="middle" fill="#1A1A1A" font-size="36" font-weight="900" font-family="'Times New Roman', Georgia, serif" letter-spacing="4">
    FURNITURE
  </text>

  <!-- Bottom: — N BEYOND — -->
  <g id="N-BEYOND-ROW">
    <line x1="20" y1="190" x2="115" y2="190" stroke="#1A1A1A" stroke-width="3" />
    <text x="230" y="196" text-anchor="middle" fill="#D32F2F" font-size="21" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="6">
      N BEYOND
    </text>
    <line x1="345" y1="190" x2="440" y2="190" stroke="#1A1A1A" stroke-width="3" />
  </g>
</svg>
