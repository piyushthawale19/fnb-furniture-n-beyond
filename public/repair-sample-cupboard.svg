<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F5F5F4"/>
  <!-- Left Half: BEFORE -->
  <g transform="translate(40, 40)">
    <rect width="340" height="520" rx="12" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="2"/>
    <!-- BEFORE badge -->
    <rect x="80" y="20" width="180" height="40" rx="20" fill="#1E293B"/>
    <text x="170" y="46" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="18" letter-spacing="2">BEFORE</text>
    <!-- Rusted Old Almirah -->
    <rect x="70" y="80" width="200" height="400" rx="6" fill="#A8A29E" stroke="#78716C" stroke-width="4"/>
    <!-- Doors division -->
    <line x1="170" y1="80" x2="170" y2="480" stroke="#78716C" stroke-width="3"/>
    <!-- Rust stains -->
    <path d="M 80 100 Q 120 140 90 220 Q 140 280 85 360" stroke="#B45309" stroke-width="12" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 180 150 Q 220 220 200 320 Q 240 400 190 450" stroke="#9A3412" stroke-width="16" fill="none" opacity="0.65" stroke-linecap="round"/>
    <path d="M 100 400 Q 150 440 250 420" stroke="#78350F" stroke-width="10" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- Old handle -->
    <rect x="180" y="270" width="30" height="12" rx="3" fill="#57534E"/>
  </g>
  <!-- Green arrow divider -->
  <g transform="translate(385, 270)">
    <path d="M 0 15 L 15 0 L 30 15 L 20 15 L 20 40 L 10 40 L 10 15 Z" transform="rotate(90 15 20)" fill="#16A34A"/>
    <path d="M -10 15 L 5 0 L 20 15 L 10 15 L 10 40 L 0 40 L 0 15 Z" transform="rotate(90 15 20)" fill="#15803D"/>
  </g>
  <!-- Right Half: AFTER -->
  <g transform="translate(420, 40)">
    <rect width="340" height="520" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
    <!-- AFTER badge -->
    <rect x="80" y="20" width="180" height="40" rx="20" fill="#16A34A"/>
    <text x="170" y="46" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="18" letter-spacing="2">AFTER</text>
    <!-- Restored Dark Grey Glossy Powder Coated Almirah -->
    <rect x="70" y="80" width="200" height="400" rx="6" fill="#334155" stroke="#1E293B" stroke-width="4"/>
    <!-- Gloss reflection -->
    <path d="M 80 90 L 160 90 L 120 470 L 80 470 Z" fill="#FFFFFF" opacity="0.1"/>
    <!-- Doors division -->
    <line x1="170" y1="80" x2="170" y2="480" stroke="#1E293B" stroke-width="3"/>
    <!-- Chrome Handle & Keyhole -->
    <rect x="180" y="265" width="35" height="10" rx="3" fill="#E2E8F0" stroke="#94A3B8"/>
    <circle cx="185" cy="290" r="5" fill="#E2E8F0"/>
  </g>
</svg>
